<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MMS CAFE — Official Links & Menu</title>
  <meta name="description" content="Google Maps, Facebook, Instagram & TikTok for Binh Thanh & Quận 9.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mmscafe.github.io/">
  <meta property="og:title" content="MMS CAFE — Official Links & Menu">
  <meta property="og:description" content="Google Maps, Facebook, Instagram & TikTok for Binh Thanh & Quận 9.">
  <meta property="og:image" content="https://mmscafe.github.io/og-card.jpg">
  <meta property="og:image:secure_url" content="https://mmscafe.github.io/og-card.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="MMS CAFE — Official Links & Menu">
  <meta name="twitter:description" content="Google Maps, Facebook, Instagram & TikTok for Binh Thanh & Quận 9.">
  <meta name="twitter:image" content="https://mmscafe.github.io/og-card.jpg">
  <meta name="theme-color" content="#1B1410">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css?v=20261120v4">
</head>
<body class="theme-cafe">
  <div class="glow" aria-hidden="true"></div>
  <main class="page">
    <header class="hero">
      <div class="brand-badge">
        <img src="assets/mms-logo.png" alt="MMS CAFE" width="200" height="200">
      </div>
      <h1 class="brand" data-brand></h1>
      <p class="tagline" data-tagline>Menu & Official Links</p>
      <div class="hero-rule" aria-hidden="true"></div>
    </header>

    <section class="branches" id="branches" aria-label="Cafe branches"></section>

    <section class="share">
      <p>This is the same link as the QR code. Copy and share it anywhere.</p>
      <button type="button" class="share-btn" id="share-copy">Copy Page Link</button>
      <p class="page-url" data-page-url></p>
    </section>

    <p class="footer" data-brand></p>
  </main>

  <div class="modal" id="menu-modal" role="dialog" aria-modal="true" aria-labelledby="menu-title">
    <div class="modal-head">
      <div class="modal-row">
        <h2 class="modal-title" id="menu-title">MMS CAFE MENU</h2>
        <button type="button" class="close-btn" id="close-menu" aria-label="Close">✕</button>
      </div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="gallery" id="gallery"></div>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
    <div class="lightbox-bar">
      <span id="lb-cap"></span>
      <button type="button" class="close-btn" id="lb-close" aria-label="Close">✕</button>
    </div>
    <div class="lightbox-stage" id="lb-stage">
      <button type="button" class="lightbox-nav prev" id="lb-prev" aria-label="Previous">‹</button>
      <img id="lb-img" alt="">
      <button type="button" class="lightbox-nav next" id="lb-next" aria-label="Next">›</button>
    </div>
    <div class="lightbox-tools">
      <button type="button" class="tool-btn" id="lb-zoom">Zoom</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="data.js?v=20261120v4"></script>
  <script src="js/app.js?v=20261120v4"></script>
</body>
</html>
